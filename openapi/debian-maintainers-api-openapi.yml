openapi: 3.2.0
info:
  title: Debian Ultimate Database (UDD) Web Tools Maintainers API
  description: The Ultimate Debian Database (UDD) gathers Debian package, bug, Lintian, popcon, and reproducibility data into a single SQL database. UDD exposes web tools and JSON exports (such as the bugs-search and maintainer dashboards) at udd.debian.org rather than a single formal REST API.
  version: '1.0'
servers:
- url: https://udd.debian.org
  description: UDD web tools
tags:
- name: Maintainers
paths:
  /dmd/:
    get:
      summary: Maintainer dashboard
      operationId: getMaintainerDashboard
      tags:
      - Maintainers
      responses:
        '200':
          description: Dashboard data for a maintainer or team.
