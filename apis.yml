description: >-
  Debian is a free operating system distribution maintained by the Debian Project, a community of more than a thousand
  volunteers worldwide. Debian provides a number of developer-facing services including a source-code browsing API at
  sources.debian.org, the Bug Tracking System (BTS) at bugs.debian.org, and the Ultimate Debian Database (UDD) - a
  single Postgres database aggregating package, bug, Lintian, popcon, and reproducibility data for cross-cutting
  queries.
